[package]
name = "zng-swgl"
version = "0.5.0"
license = "MPL-2.0"
authors = ["The Mozilla Project Developers"]
build = "build.rs"
description = "Software OpenGL implementation for WebRender."
readme = "../FORK.md"

[build-dependencies]
cc = "1.0.46"
glsl-to-cxx = { path = "../glsl-to-cxx", package = "zng-glsl-to-cxx" }
webrender_build = { path = "../webrender_build", package = "zng-webrender-build" }

[dependencies]
gleam = { workspace = true }
